name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# Um push novo na mesma PR cancela a execução anterior — a org tem limite de
# minutos de Actions e não faz sentido pagar por um commit já substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint e formatação (Biome)
        run: bun run lint

      - name: Tipos (TypeScript)
        run: bun run typecheck

      - name: Auditoria de dependências
        run: bun audit

      - name: Build (Next.js)
        run: bun run build
